name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest main to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST secret'; exit 1; }
          test -n "$SERVER_USER" || { echo 'Missing SERVER_USER secret'; exit 1; }
          test -n "$SERVER_SSH_KEY" || { echo 'Missing SERVER_SSH_KEY secret'; exit 1; }
          test -n "$SERVER_KNOWN_HOSTS" || { echo 'Missing SERVER_KNOWN_HOSTS secret'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_HOST" 'bash /opt/vhiti/deploy/release.sh'
