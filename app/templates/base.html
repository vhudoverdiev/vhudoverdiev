{% from '_icons.html' import icon, course_icon %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="application-name" content="Войти в IT">
  <meta name="apple-mobile-web-app-title" content="Войти в IT">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/icon-180.png', v='20261024') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="manifest" href="{{ url_for('main.web_manifest') }}">
  <meta name="theme-color" content="#f4f6f0"><meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <title>{% block title %}Войти в IT{% endblock %}</title>
  <meta name="description" content="Понятный маршрут в IT: учитесь в своём ритме, закрепляйте знания и видьте свой прогресс.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20261025-check-1') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/learning.css', v='20261025-check-1') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css', v='20261024-1') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack" aria-live="polite">{% for category, message in messages %}<div class="flash flash-{{ category }}"><span>{{ message }}</span><button type="button" class="flash-close" aria-label="Закрыть сообщение">{{ icon('close') }}</button></div>{% endfor %}</div>{% endif %}{% endwith %}
<button class="menu-backdrop" type="button" aria-label="Закрыть меню" hidden></button>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='js/app.js', v='20261025-check-1') }}" defer></script>
</body></html>
